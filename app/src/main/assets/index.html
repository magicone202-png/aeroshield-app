<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="ui-version" content="3">
<!-- AEROSHIELD_UI: этот файл приложение скачивает с GitHub как обновление экранов -->
<title>АэроЩит-ГО</title>
<style>
:root{--bg:#11181A;--card:#182124;--line:#283438;--ink:#E7EEEC;--mut:#8D9C99;--sig:#FF7A33;--ok:#43C487;--warn:#F2B53B;--bad:#FF5468;--duty:#7CB8CB;--alarm:#8E0C20}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Roboto,"Segoe UI",sans-serif}
.num{font-family:ui-monospace,"Roboto Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:32px;height:32px;flex:none}
.brand b{font-size:16px;flex:1}
.gear{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:6px 10px;font-size:13px}
.tabs{display:flex;gap:4px;margin-top:10px}
.tabs button{flex:1;border:0;background:none;color:var(--mut);font:600 14px inherit;font-family:inherit;padding:10px 4px;border-bottom:3px solid transparent}
.tabs button[aria-current]{color:var(--ink);border-color:var(--sig)}
.wrap{padding:14px;display:flex;flex-direction:column;gap:12px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
h2{font-size:15px;margin:0 0 10px}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:700}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px;font-family:inherit;color:#111;background:var(--ink);min-height:46px}
.btn.sig{background:var(--sig);color:#1A0C04}.btn.bad{background:var(--bad);color:#fff}.btn.ok{background:var(--ok);color:#06210f}
.btn.gh{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:14px}.kv dt{color:var(--mut)}.kv dd{margin:0}
.l0{color:var(--ok)}.l1{color:var(--warn)}.l2{color:var(--bad)}.mut{color:var(--mut)}
.big{font-size:48px;font-weight:700;line-height:1}
.note{font-size:13px;color:var(--mut);background:rgba(255,255,255,.04);border-radius:10px;padding:9px 11px;margin:10px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--mut)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--mut)}.chip.on i{background:var(--ok)}.chip.off i{background:var(--bad)}
.kinds{display:grid;gap:8px}
.kind{text-align:left;border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:11px 12px;font:600 15px inherit;font-family:inherit}
.kind small{display:block;font-weight:400;color:var(--mut);font-size:12px}
.alarm{background:var(--alarm);border-color:#B5122B;color:#fff}
.alarm .lbl{color:#FFC9CF}
.ackbox{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.12);border-radius:10px;padding:10px 12px;margin:8px 0 12px}
.ev div{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}.ev div:first-child{border-top:0}
.ev .t{color:var(--mut);flex:none;width:62px}
.over{position:fixed;inset:0;z-index:50;background:var(--alarm);color:#fff;padding:28px 20px;display:flex;flex-direction:column;justify-content:center;gap:14px;overflow:auto}
.over h1{font-size:34px;margin:0;line-height:1.1}
.over ol{margin:0;padding-left:22px;font-size:16px;display:grid;gap:4px}
.over .btn{width:100%}
.phone{border:2px solid var(--line);border-radius:26px;padding:14px;position:relative;overflow:hidden;min-height:420px;background:var(--bg)}
.phone .over{position:absolute;padding:20px 16px;justify-content:flex-start}
.phone .over h1{font-size:26px}
.demo{display:grid;gap:12px}
@media(min-width:780px){.demo{grid-template-columns:1.2fr 1fr;align-items:start}}
input{width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:11px 12px;font-size:16px;margin-top:6px;font-family:inherit}
label{display:block;margin-top:10px;font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;max-width:90%;display:none;z-index:60}
/* заставка */
.splash{position:fixed;inset:0;z-index:100;background:#fff;color:#1d1640;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .5s}
.splash.hide{opacity:0;pointer-events:none}
.splash .logo{width:min(78vw,340px)}
.splash .logo img{width:100%;height:auto;display:block}
.splash .org{text-align:center;color:var(--mut);font-size:13px;line-height:1.35;max-width:260px}
.splash .bar{width:220px;height:6px;border-radius:3px;background:#E6E2F3;overflow:hidden;margin-top:14px}
.splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5B3FB5,#E8322C);border-radius:3px;animation:load 2.4s ease-in-out forwards}
.splash .pct{font-size:12px;color:#6E6893}
@keyframes load{0%{width:0}60%{width:72%}100%{width:100%}}
/* обучение */
.intro{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;padding:24px 20px}
.intro .slide{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:520px;margin:0 auto;width:100%}
.intro h1{font-size:26px;margin:0;line-height:1.15}
.intro p{margin:0;font-size:16px;color:#C9D3D1}
.intro .ico{font-size:52px}
.intro .dots{display:flex;gap:6px;justify-content:center;margin:12px 0}
.intro .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.intro .dots i.on{background:var(--sig);width:22px;border-radius:4px}
.intro ul{margin:0;padding-left:20px;display:grid;gap:6px;font-size:15px;color:#C9D3D1}
.badge{display:inline-block;background:rgba(255,122,51,.15);color:var(--sig);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;letter-spacing:.05em}
.upd{background:#1E4A5A;border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:14px}
.upd button{margin-left:auto;border:0;border-radius:8px;padding:8px 10px;font-weight:600;background:#fff;color:#1E4A5A}
.wx{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.wx .t{font-size:44px;font-weight:700;line-height:1}
.arrow{display:inline-block;transition:transform .3s}
@keyframes pulse{50%{transform:scale(1.1)}}.pulse{animation:pulse 1s infinite;display:inline-block}
</style></head>

<script>
/* ===== Настройки и сеть ===== */
var NATIVE=!!window.Android;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var CFG={base:ls('base')!=null?ls('base'):'http://172.20.10.9',pinS:ls('pinS')||'1234',pinR:ls('pinR')||'7777'};
var TAB=ls('tab')||'res', KS=ls('kS')||'', KR=ls('kR')||'';
var CB={},cbn=0;
window.__net=function(id,code,text){var f=CB[id];delete CB[id];if(f)f(code,text)};
function req(method,path,data){
  return new Promise(function(res){
    var q=new URLSearchParams(data||{}).toString(),url=CFG.base+path+(method=='GET'&&q?'?'+q:'');
    var done=function(c,t){var j=null;try{j=JSON.parse(t)}catch(e){}res({code:c,json:j})};
    if(NATIVE){var id='r'+(++cbn);CB[id]=done;Android.http(id,method,url,method=='POST'?q:'')}
    else fetch(url,method=='POST'?{method:'POST',body:new URLSearchParams(data||{})}:{}).then(function(r){return r.text().then(function(t){done(r.status,t)})}).catch(function(){done(0,'')});
  });
}
function login(pin){return req('POST','/api/login',{pin:pin}).then(function(r){return r.code==200&&r.json?r.json.k:''})}
function nat(){if(!NATIVE)return {};try{return JSON.parse(Android.state())}catch(e){return {}}}

/* ===== Помощники ===== */
var KINDS=[['Опасность БПЛА','Угроза атаки беспилотников, всем в укрытие'],['Аварийный выброс','Закрыть окна, оставаться дома'],['Учебная тревога','Проверка оповещения жителей']];
var STEPS=[['Отойдите от окон','Пройдите в коридор, ванную или подвал','Не выходите до сигнала отбоя'],['Закройте окна и форточки','Выключите вытяжку','Ждите указаний диспетчера'],['Подтвердите получение кнопкой ниже','Действий в реальности не требуется']];
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function hm(t){if(!t)return'';return new Date(t*1000).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}
function hms(e){return e.t?new Date(e.t*1000).toLocaleTimeString('ru-RU'):'+'+e.up+' с'}
function dur(s){return s<60?s+' с':Math.floor(s/60)+' мин'}
function toast(t){var el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){el.style.display='none'},2500)}
var actx=null;
function beep(n,f){try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();actx.resume();var t=actx.currentTime;for(var i=0;i<(n||2);i++){var o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f||880;g.gain.value=.08;o.connect(g);g.connect(actx.destination);o.start(t+i*.35);o.stop(t+i*.35+.22)}}catch(e){}}
function vib(ms){if(NATIVE)Android.vibrate(ms);else try{navigator.vibrate(ms)}catch(e){}}

/* ===== Данные ===== */
var S=null, R=null, N={}, prevS=null, alerts=[], pick=-1, busy=false, cfgOpen=false, lastRing=0;
function pollStation(){
  if(!KS){login(CFG.pinS).then(function(k){if(k){KS=k;ls('kS',k)}});return}
  req('GET','/api/state',{k:KS}).then(function(r){
    if(r.code==401){KS='';return}
    if(r.code==200&&r.json){detect(r.json);S=r.json;S._ok=Date.now()}
    else if(S)S._lost=true;
  });
}
function pollRes(){
  if(!KR){login(CFG.pinR).then(function(k){if(k){KR=k;ls('kR',k)}});return}
  req('GET','/api/rstate',{k:KR}).then(function(r){
    if(r.code==401){KR='';return}
    if(r.code==200&&r.json){R=r.json;R._ok=Date.now()} else if(R)R._lost=true;
  });
}
function detect(s){
  var p=prevS;prevS=s;if(!p)return;
  function a(x,l){alerts.unshift({t:Date.now(),x:x,l:l});if(alerts.length>6)alerts.pop();beep(l==2?4:2,l==2?988:784);vib(300)}
  if(s.lvl==2&&p.lvl<2)a('Опасный уровень CO: '+s.co.toFixed(0)+' ppm',2);
  if(s.lvl<2&&p.lvl==2)a('CO снизился до '+s.co.toFixed(0)+' ppm',0);
  if(s.alarm.on&&s.alarm.ack==1&&p.alarm.ack!=1)a('Житель в укрытии',0);
  if(s.alarm.on&&s.alarm.ack==2&&p.alarm.ack!=2)a('Житель прочитал тревогу',1);
  if(s.alarm.on&&s.alarm.noAns&&!p.alarm.noAns)a('Житель не ответил 3 минуты',2);
  if(p.resOn&&!s.resOn)a('Телефон жителя пропал из сети',1);
}

/* ===== Экран диспетчера ===== */
function stationHtml(compact){
  if(!S)return '<section class="card"><h2>Пульт станции</h2><div class="mut">Подключаюсь к прибору 1 по адресу <span class="num">'+esc(CFG.base||'(этот сайт)')+'</span>… Телефон должен быть в той же сети Wi‑Fi, что и прибор.</div></section>';
  var s=S,a=s.alarm,h='';
  var stale=Date.now()-s._ok>6000;
  h+='<div class="row" style="gap:6px"><span class="chip '+(stale?'off':'on')+'"><i></i>Прибор 1 '+(stale?'не отвечает':'на связи')+'</span><span class="chip '+(s.resOn?'on':'off')+'"><i></i>Житель '+(s.resOn?'на связи':'не в сети')+'</span></div>';
  if(alerts.length)h+='<section class="card" style="border-color:var(--sig)"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Уведомления</h2><button class="btn gh" style="min-height:34px;padding:6px 10px" data-a="dismiss">Скрыть</button></div><div class="ev" style="margin-top:8px">'+alerts.map(function(x){return '<div><span class="t num">'+new Date(x.t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})+'</span><span class="l'+x.l+'" style="font-weight:600">'+esc(x.x)+'</span></div>'}).join('')+'</div></section>';
  if(a.on){
    var ack=a.ack==1?['✅','Житель в укрытии',hm(a.ackAt)]:a.ack==2?['👁','Житель прочитал тревогу',hm(a.ackAt)]:['⏳',a.noAns?'Житель не отвечает — позвоните ему':'Ждём ответа жителя',dur(a.sec)];

// Шатура и Шатурская ГРЭС
var WX_LAT=55.578, WX_LON=39.545, GRES=[55.57936,39.56051], TOWN=[55.5777,39.5445];
var WX=null; try{WX=JSON.parse(ls('wx')||'null')}catch(e){}
var WMO={0:'Ясно',1:'Преимущественно ясно',2:'Переменная облачность',3:'Пасмурно',45:'Туман',48:'Изморозь, туман',51:'Слабая морось',53:'Морось',55:'Сильная морось',56:'Ледяная морось',57:'Ледяная морось',61:'Небольшой дождь',63:'Дождь',65:'Сильный дождь',66:'Ледяной дождь',67:'Ледяной дождь',71:'Небольшой снег',73:'Снег',75:'Сильный снег',77:'Снежная крупа',80:'Ливень',81:'Ливень',82:'Сильный ливень',85:'Снегопад',86:'Сильный снегопад',95:'Гроза',96:'Гроза с градом',99:'Гроза с градом'};
var WICO=function(c){return c==0||c==1?'☀️':c==2?'⛅':c==3?'☁️':c<50?'🌫️':c<70||(c>=80&&c<=82)?'🌧️':c<90?'🌨️':'⛈️'};
function getUrl(url){return new Promise(function(res){var done=function(c,t){var j=null;try{j=JSON.parse(t)}catch(e){}res({code:c,json:j})};
  if(NATIVE){var id='w'+(++cbn);CB[id]=done;Android.http(id,'GET',url,'')}else fetch(url).then(function(r){return r.text().then(function(t){done(r.status,t)})}).catch(function(){done(0,'')})})}
function loadWeather(){
  if(WX&&Date.now()-WX._at<10*60000)return;
  getUrl('https://api.open-meteo.com/v1/forecast?latitude='+WX_LAT+'&longitude='+WX_LON+'&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure&wind_speed_unit=ms&timezone=Europe%2FMoscow').then(function(r){
    if(r.code==200&&r.json&&r.json.current){WX=r.json.current;WX._at=Date.now();ls('wx',JSON.stringify(WX));draw()}
  });
}
function bearing(a,b){var f1=a[0]*Math.PI/180,f2=b[0]*Math.PI/180,dl=(b[1]-a[1])*Math.PI/180;var y=Math.sin(dl)*Math.cos(f2),x=Math.cos(f1)*Math.sin(f2)-Math.sin(f1)*Math.cos(f2)*Math.cos(dl);return (Math.atan2(y,x)*180/Math.PI+360)%360}
function dirName(d){return ['северный','северо-восточный','восточный','юго-восточный','южный','юго-западный','западный','северо-западный'][Math.round(d/45)%8]}
function wxHtml(){
  if(!WX)return '<section class="card"><h2>Погода в Шатуре</h2><div class="mut">Загружаю… Для погоды нужен интернет (точка доступа iPhone его раздаёт).</div></section>';
  var w=WX,to=(w.wind_direction_10m+180)%360,toTown=bearing(GRES,TOWN),diff=Math.abs(((to-toTown)+540)%360-180);
  var risk=diff<45&&w.wind_speed_10m>=1;
  var age=Math.round((Date.now()-w._at)/60000);
  return '<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Погода в Шатуре</h2><span class="mut" style="font-size:12px">'+(age<1?'только что':age+' мин назад')+'</span></div>'+
    '<div class="wx" style="margin-top:10px"><span style="font-size:42px">'+WICO(w.weather_code)+'</span><div><span class="t num">'+(w.temperature_2m>0?'+':'')+Math.round(w.temperature_2m)+'°</span><div class="mut">'+(WMO[w.weather_code]||'')+', ощущается '+Math.round(w.apparent_temperature)+'°</div></div></div>'+
    '<dl class="kv" style="margin-top:12px"><dt>Ветер</dt><dd><span class="arrow" style="transform:rotate('+to+'deg)">↑</span> '+w.wind_speed_10m.toFixed(1).replace('.',',')+' м/с, '+dirName(w.wind_direction_10m)+'</dd>'+
    '<dt>Влажность</dt><dd>'+Math.round(w.relative_humidity_2m)+'%</dd><dt>Давление</dt><dd>'+Math.round(w.surface_pressure*0.750062)+' мм рт. ст.</dd><dt>Осадки</dt><dd>'+(w.precipitation>0?w.precipitation+' мм':'нет')+'</dd></dl>'+
    '<p class="note" style="'+(risk?'color:var(--warn)':'')+'">'+(risk?'Ветер дует от ГРЭС в сторону жилых кварталов. Выбросы станции может нести к домам — следите за показаниями прибора и реже проветривайте.':'Ветер сейчас не несёт выбросы ГРЭС в сторону жилых кварталов.')+'</p></section>';
}
